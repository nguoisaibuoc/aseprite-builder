name: Build and release Aseprite

on:
  push:
    branches:
      - main
    paths:
      - 'BuildLog.md'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish GitHub Release (disable for build-only validation)
        type: boolean
        required: true
        default: true
env:
  BUILD_TYPE: Release

jobs:
  fetch-aseprite-info:
    name: Fetch deps info
    runs-on: ubuntu-latest
    outputs:
      download-link: ${{ steps.aseprite-link.outputs.download-link }}
      release-tag: ${{ steps.aseprite-link.outputs.release-tag }}
    steps:
      - name: Fetch Aseprite release link
        id: aseprite-link
        uses: a1393323447/fetch-release@main
        with:
            group: aseprite
            repo: aseprite
            match: Aseprite-.*?-Source.zip

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: fetch-aseprite-info
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: ncipollo/release-action@v1.21.0
        with:
          tag: ${{ needs.fetch-aseprite-info.outputs.release-tag }}
          body: Aseprite-${{ needs.fetch-aseprite-info.outputs.release-tag }}
          skipIfReleaseExists: true
          token: ${{ secrets.GITHUB_TOKEN }}

  build-aseprite:
    name: Build Aseprite
    needs: [fetch-aseprite-info, create-release]
    if: >-
      ${{ !cancelled() && needs.fetch-aseprite-info.result == 'success' &&
          (needs.create-release.result == 'success' ||
           (github.event_name == 'workflow_dispatch' && !inputs.publish &&
            needs.create-release.result == 'skipped')) }}
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    # GitHub has no Fedora runners, so the Fedora build runs in a container on
    # an Ubuntu host. Entries without `container` run directly on the runner.
    container: ${{ matrix.container }}
    strategy:
        fail-fast: false
        matrix:
          include:
            - platform: Windows
              os: windows-latest
            - platform: Fedora
              os: ubuntu-latest
              container: fedora:43
            - platform: macOS
              os: macOS-latest
    steps:
      - name: Install Dependencies
        if: matrix.platform == 'Fedora'
        shell: bash
        # The Fedora image is minimal and runs as root (no sudo). git must be
        # installed before actions/checkout.
        run: |
          dnf install -y \
            git gcc-c++ cmake ninja-build wget unzip zip \
            libstdc++-static \
            pixman-devel freetype-devel harfbuzz-devel zlib-devel \
            openssl-devel \
            libX11-devel libXcursor-devel libXi-devel libXrandr-devel \
            mesa-libGL-devel fontconfig-devel
      - uses: actions/checkout@v7
      - name: Install Aseprite
        shell: bash
        run: |
          git clone --recurse-submodules -j8 https://github.com/aseprite/aseprite --branch ${{ needs.fetch-aseprite-info.outputs.release-tag }}
      - name: Install Skia
        working-directory: aseprite
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]] ; then
            choco install wget -y --no-progress
            wget https://github.com/aseprite/skia/releases/download/m124-08a5439a6b/Skia-Windows-Release-x64.zip
            unzip Skia-Windows-Release-x64.zip -d skia
          elif [[ "${{ runner.os }}" == "macOS" ]] ; then
            wget https://github.com/aseprite/skia/releases/download/m124-08a5439a6b/Skia-macOS-Release-arm64.zip
            unzip Skia-macOS-Release-arm64.zip -d skia
          else
            wget https://github.com/aseprite/skia/releases/download/m124-08a5439a6b/Skia-Linux-Release-x64.zip
            unzip Skia-Linux-Release-x64.zip -d skia
          fi
      # Fedora gets ninja from dnf above.
      - uses: aseprite/get-ninja@main
        if: matrix.platform != 'Fedora'
      - uses: ilammy/msvc-dev-cmd@v1.13.0
        if: runner.os == 'Windows'
      - name: Generating Makefiles
        shell: bash
        working-directory: aseprite
        run: |
          export enable_ccache=off
          export laf_backend=skia
          export enable_scripting=on

          if [[ "${{ runner.os }}" == "macOS" ]] ; then
            export skia_arch=arm64
          else
            export skia_arch=x64
          fi

          # Fedora doesn't ship static OpenSSL libs, so link it dynamically there.
          if [[ "${{ matrix.platform }}" == "Fedora" ]] ; then
            export openssl_static=OFF
          else
            export openssl_static=ON
          fi

          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.9 \
            -DENABLE_TESTS=OFF \
            -DENABLE_I18N_STRINGS=ON \
            -DENABLE_SCRIPTING=$enable_scripting \
            -DENABLE_CCACHE=$enable_ccache \
            -DLAF_BACKEND=$laf_backend \
            -DSKIA_DIR=$(realpath skia) \
            -DOPENSSL_USE_STATIC_LIBS=$openssl_static \
            -DSKIA_LIBRARY_DIR=$(realpath skia/out/Release-$skia_arch)
      - name: Compiling
        shell: bash
        working-directory: aseprite
        run: |
          cd build && ninja
      - name: Clean Up Build folder
        working-directory: aseprite/build/bin
        shell: bash
        run: find . -mindepth 1 ! \( -name 'aseprite' -o -name 'aseprite.exe' -o -name 'data' -prune -o -name 'Aseprite.app' -prune \) -exec rm -rf {} +
      - name: Verify bundled translations
        working-directory: aseprite/build/bin
        shell: bash
        run: |
          data_dir=data
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            data_dir=Aseprite.app/Contents/Resources/data
          fi
          strings_dir="$data_dir/strings.git"

          translation_found=false
          for translation in "$strings_dir"/*.ini; do
            if [[ "${translation##*/}" != en.ini && -f "$translation" ]] &&
                grep -Eq '^[[:space:]]*\[[^]]+\]' "$translation"; then
              translation_found=true
              break
            fi
          done
          if [[ "$translation_found" != true ]]; then
            echo "No non-English translation content found in $strings_dir" >&2
            exit 1
          fi

          # Keep translations and licensing files; omit only Git metadata.
          rm -rf "$strings_dir/.git"
      - name: Make portable zip
        working-directory: aseprite/build/bin
        shell: bash
        run: echo '# This file is here so Aseprite behaves as a portable program' > aseprite.ini
      - name: Verify Linux executable
        if: runner.os == 'Linux'
        timeout-minutes: 2
        working-directory: aseprite/build/bin
        shell: bash
        run: bash "$GITHUB_WORKSPACE/.github/scripts/verify-linux.sh"
      - name: Create ZIP archive
        if: runner.os != 'macOS'
        working-directory: aseprite/build/bin
        shell: bash
        run: |
          ARCHIVE="Aseprite-${{ needs.fetch-aseprite-info.outputs.release-tag }}-${{ matrix.platform }}.zip"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            7z -tzip a "$ARCHIVE" *
          else
            # 7z isn't available in the Fedora image; zip also keeps the exec bit.
            zip -r "$ARCHIVE" *
          fi
      - name: Package and verify macOS archive
        if: runner.os == 'macOS'
        timeout-minutes: 10
        working-directory: aseprite/build/bin
        shell: bash
        env:
          ARCHIVE_NAME: Aseprite-${{ needs.fetch-aseprite-info.outputs.release-tag }}-${{ matrix.platform }}.zip
        run: bash "$GITHUB_WORKSPACE/.github/scripts/package-macos.sh" "$ARCHIVE_NAME"
      - name: Upload validation artifact
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}
        uses: actions/upload-artifact@v7
        with:
          name: Aseprite-${{ needs.fetch-aseprite-info.outputs.release-tag }}-${{ matrix.platform }}-${{ runner.arch }}-attempt${{ github.run_attempt }}
          path: aseprite/build/bin/Aseprite-${{ needs.fetch-aseprite-info.outputs.release-tag }}-${{ matrix.platform }}.zip
          if-no-files-found: error
          compression-level: 0
      - name: Upload release
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: aseprite/build/bin/Aseprite-${{ needs.fetch-aseprite-info.outputs.release-tag }}-${{ matrix.platform }}.zip
          asset_name: Aseprite-${{ needs.fetch-aseprite-info.outputs.release-tag }}-${{ matrix.platform }}.zip
          tag: ${{ needs.fetch-aseprite-info.outputs.release-tag }}
